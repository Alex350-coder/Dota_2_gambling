# Installed from Claude/ci/workflows/e2e.yml by task T-005.
# Warning-only on ordinary PRs; blocking on the nightly run and on release PRs (CI_CD.md §4).
# Actions are pinned to full commit SHAs (RULE-E12, MET-SEC-07).

name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '23 3 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: e2e
    # On PRs, run only when labelled `e2e` or `release`; always run on schedule/dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      contains(github.event.pull_request.labels.*.name, 'release')
    # Non-blocking for ordinary PRs; the nightly/release run is a required signal.
    continue-on-error: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release') }}
    runs-on: ubuntu-latest
    env:
      MONEY_MODE: SIMULATED
      DATABASE_URL: postgresql://postgres:ci_local_only@localhost:5432/betting_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: betting_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm build
      # Includes the axe accessibility assertions (T-715); violations fail the suite.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
